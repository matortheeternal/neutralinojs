name: Card Magician runtime

on:
  push:
    tags: ['v*-cm.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_x64
            os: ubuntu-22.04
            cmake: ''
          - target: linux_arm64
            os: ubuntu-22.04-arm
            cmake: ''
          - target: linux_armhf
            os: ubuntu-22.04
            cmake: '-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-armhf.cmake'
          - target: win_x64.exe
            os: windows-2022
            cmake: ''
          - target: mac_arm64
            os: macos-14
            cmake: '-DCMAKE_OSX_ARCHITECTURES=arm64'
          - target: mac_x64
            os: macos-15-intel
            cmake: '-DCMAKE_OSX_ARCHITECTURES=x86_64'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && matrix.target != 'linux_armhf'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev libxcb1-dev libx11-dev libxrandr-dev libxtst-dev libpng-dev
      - name: Install ARMHF cross compiler and libraries
        if: matrix.target == 'linux_armhf'
        run: |
          sudo dpkg --add-architecture armhf
          sudo sed -i -E 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          printf '%s\n' \
            'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy main universe' \
            'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe' \
            'deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main universe' \
            | sudo tee /etc/apt/sources.list.d/armhf.list
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libgtk-3-dev:armhf libwebkit2gtk-4.0-dev:armhf libxcb1-dev:armhf libx11-dev:armhf libxrandr-dev:armhf libxtst-dev:armhf libpng-dev:armhf
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build
        shell: bash
        run: |
          cmake -S . -B build-cm -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake }}
          cmake --build build-cm --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: neutralino-${{ matrix.target }}
          path: bin/neutralino-${{ matrix.target }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: neutralino-*
          path: runtime
          merge-multiple: true
      - name: Build universal macOS binary
        run: lipo runtime/neutralino-mac_x64 runtime/neutralino-mac_arm64 -create -output runtime/neutralino-mac_universal
      - name: Package binaries with source revision and checksums
        env:
          RUNTIME_TAG: ${{ github.ref_name }}
          RUNTIME_COMMIT: ${{ github.sha }}
        run: python3 scripts/package_card_magician.py runtime
      - uses: actions/upload-artifact@v4
        with:
          name: card-magician-runtime
          path: dist-cm/*
          if-no-files-found: error
      - name: Publish tagged fork release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-cm/* \
            --verify-tag --prerelease \
            --title "Card Magician runtime $GITHUB_REF_NAME" \
            --notes "Pinned Card Magician build from $GITHUB_SHA. Includes deferred Chrome close, owned browser process cleanup, and per-binary SHA-256 checksums."
